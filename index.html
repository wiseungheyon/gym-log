<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬스 운동 기록 & 1RM 계산기</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --sub: #6b7280;
    --line: #e5e7eb;
    --main: #ea580c;        /* 근력 */
    --main-soft: #fff1e8;
    --cardio: #0e7490;      /* 유산소 */
    --cardio-soft: #e6f6f9;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 15px;
  }
  header {
    background: #1f2328;
    color: #fff;
    padding: 20px 24px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: #c9ccd1; font-size: 13px; }

  main {
    max-width: 1080px;
    margin: 24px auto;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 17px; }

  label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 16px;   /* 16px 미만이면 아이폰에서 입력할 때 화면이 확대됨 */
    font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--main); border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  button {
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-main { background: var(--main); color: #fff; width: 100%; margin-top: 14px; font-weight: bold; }
  .btn-main:hover { filter: brightness(0.93); }
  .btn-small { background: #f3f4f6; color: var(--text); padding: 6px 10px; font-size: 13px; }
  .btn-del { background: none; color: var(--danger); padding: 4px 8px; font-size: 13px; }

  /* 근력 / 유산소 선택 탭 */
  .type-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px; }
  .type-tabs button { background: #f3f4f6; color: var(--sub); }
  .type-tabs button.active.strength { background: var(--main); color: #fff; }
  .type-tabs button.active.cardio { background: var(--cardio); color: #fff; }
  .hidden { display: none; }

  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: #15803d; }

  /* 통계 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr 1fr; } }
  .stat { background: #f9fafb; border-radius: 8px; padding: 12px; }
  .stat .label { font-size: 12px; color: var(--sub); }
  .stat .value { font-size: 20px; font-weight: bold; margin-top: 4px; }
  .stat .unit { font-size: 13px; font-weight: normal; color: var(--sub); }

  /* 기록 목록 */
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .list-head h2 { margin: 0; }
  .filter button { background: #f3f4f6; color: var(--sub); padding: 6px 10px; font-size: 13px; }
  .filter button.active { background: #1f2328; color: #fff; }
  ul.records { list-style: none; margin: 0; padding: 0; }
  ul.records li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .badge { font-size: 12px; font-weight: bold; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .badge.strength { background: var(--main-soft); color: var(--main); }
  .badge.cardio { background: var(--cardio-soft); color: var(--cardio); }
  .rec-body { flex: 1; }
  .rec-name { font-weight: bold; }
  .rec-detail { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .empty { color: var(--sub); text-align: center; padding: 24px 0; }

  /* 1RM 결과 */
  .result { margin-top: 14px; display: none; }
  .result.show { display: block; }
  .big { font-size: 28px; font-weight: bold; color: var(--main); }
  .bar-row { display: grid; grid-template-columns: 44px 1fr 70px; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; }
  .bar { height: 12px; background: #f3f4f6; border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--main); border-radius: 6px; }
  .bar-row .kg { text-align: right; font-weight: bold; }

  footer { text-align: center; color: var(--sub); font-size: 12px; padding: 10px 0 30px; }
</style>
</head>
<body>

<header>
  <h1>🏋️ 헬스 운동 기록 & 1RM 계산기</h1>
  <p>1주차 C++ 콘솔 프로그램을 웹 버전으로 만든 프로그램입니다 · PC와 스마트폰에서 사용 가능</p>
</header>

<main>
  <!-- 왼쪽: 입력 -->
  <section>
    <div class="card">
      <h2>내 정보</h2>
      <label for="bodyWeight">체중 (kg) · 칼로리 계산에 사용</label>
      <input type="number" id="bodyWeight" inputmode="decimal" value="75" min="20" max="300">
    </div>

    <div class="card">
      <h2>운동 추가</h2>
      <div class="type-tabs">
        <button id="tabStrength" class="active strength" onclick="selectType('strength')">근력 운동</button>
        <button id="tabCardio" class="cardio" onclick="selectType('cardio')">유산소 운동</button>
      </div>

      <label for="exName">운동 이름</label>
      <input type="text" id="exName" placeholder="예) 벤치 프레스">

      <!-- 근력 입력 -->
      <div id="strengthInputs">
        <div class="row">
          <div><label for="weight">무게(kg)</label><input type="number" id="weight" inputmode="decimal" min="0"></div>
          <div><label for="reps">횟수</label><input type="number" id="reps" inputmode="numeric" min="1"></div>
          <div><label for="sets">세트</label><input type="number" id="sets" inputmode="numeric" min="1"></div>
        </div>
      </div>

      <!-- 유산소 입력 -->
      <div id="cardioInputs" class="hidden">
        <div class="row2">
          <div><label for="minutes">시간(분)</label><input type="number" id="minutes" inputmode="numeric" min="1"></div>
          <div>
            <label for="intensity">강도</label>
            <select id="intensity">
              <option value="1">가볍게 (걷기)</option>
              <option value="2" selected>보통 (조깅)</option>
              <option value="3">강하게 (달리기)</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn-main" id="addBtn" onclick="addExercise()">추가하기</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="card">
      <h2>1RM 계산 & 목표별 중량</h2>
      <div class="row2">
        <div><label for="rmWeight">들었던 무게(kg)</label><input type="number" id="rmWeight" inputmode="decimal" min="1"></div>
        <div><label for="rmReps">반복 횟수</label><input type="number" id="rmReps" inputmode="numeric" min="1" max="30"></div>
      </div>
      <label for="goal">훈련 목표</label>
      <select id="goal">
        <option value="1">근력 (90 / 85 / 80%)</option>
        <option value="2" selected>근비대 (75 / 70 / 65%)</option>
        <option value="3">근지구력 (60 / 55 / 50%)</option>
      </select>
      <button class="btn-main" onclick="calcOneRM()">계산하기</button>
      <div class="msg error" id="rmMsg"></div>

      <div class="result" id="rmResult">
        <div style="font-size:13px;color:var(--sub)">예상 1RM</div>
        <div class="big" id="rmValue">0kg</div>
        <div style="margin-top:10px;font-weight:bold" id="rmGoalName"></div>
        <div id="rmBars"></div>
      </div>
    </div>
  </section>

  <!-- 오른쪽: 통계 + 기록 -->
  <section>
    <div class="card">
      <h2>운동 통계</h2>
      <div class="stats">
        <div class="stat"><div class="label">운동 개수</div><div class="value" id="statCount">0<span class="unit">개</span></div></div>
        <div class="stat"><div class="label">총 볼륨</div><div class="value" id="statVolume">0<span class="unit">kg</span></div></div>
        <div class="stat"><div class="label">소모 칼로리</div><div class="value" id="statKcal">0<span class="unit">kcal</span></div></div>
        <div class="stat"><div class="label">최고 1RM</div><div class="value" id="statBest">-</div></div>
      </div>
    </div>

    <div class="card">
      <div class="list-head">
        <h2>운동 기록</h2>
        <div class="filter">
          <button class="active" data-f="all" onclick="setFilter('all')">전체</button>
          <button data-f="strength" onclick="setFilter('strength')">근력</button>
          <button data-f="cardio" onclick="setFilter('cardio')">유산소</button>
          <button class="btn-small" onclick="clearAll()">전체 삭제</button>
        </div>
      </div>
      <ul class="records" id="recordList"></ul>
    </div>
  </section>
</main>

<footer>기록은 이 브라우저에 자동 저장됩니다 · 1RM 공식: Epley (무게 × (1 + 횟수 ÷ 30))</footer>

<script>
// ================================================================
//  1주차 C++ 클래스 구조를 JavaScript 클래스로 옮김
//  Exercise (기본 클래스) ← StrengthExercise, CardioExercise (상속)
// ================================================================

// 1RM 계산 (Epley 공식) - C++의 calc1RM() 함수와 같음
function calc1RM(weight, reps) {
  if (reps === 1) return weight;
  return weight * (1 + reps / 30);
}

// 소수점 한 자리로 표시
function fmt(n) {
  return (Math.round(n * 10) / 10).toFixed(1);
}

// 운동 기본 클래스 (C++의 Exercise, 순수 가상 클래스 역할)
class Exercise {
  constructor(name) {
    if (new.target === Exercise) {
      throw new Error("Exercise는 직접 만들 수 없습니다."); // 추상 클래스처럼 막기
    }
    this.name = name;
  }
  getType()         { throw new Error("재정의 필요"); }  // 순수 가상 함수 역할
  calcVolume()      { throw new Error("재정의 필요"); }
  calcCalories(bw)  { throw new Error("재정의 필요"); }
  getDetail()       { return ""; }
}

// 근력 운동 (Exercise 상속)
class StrengthExercise extends Exercise {
  constructor(name, weight, reps, sets) {
    super(name);
    this.weight = weight;
    this.reps = reps;
    this.sets = sets;
  }
  getType() { return "strength"; }
  calcVolume() { return this.weight * this.reps * this.sets; }   // 무게 x 횟수 x 세트
  calcCalories(bodyWeight) {
    // MET 5.0, 1세트당 휴식 포함 2분
    const hours = this.sets * 2 / 60;
    return 5.0 * bodyWeight * hours;
  }
  calc1RM() { return calc1RM(this.weight, this.reps); }
  getDetail() {
    return `${this.weight}kg × ${this.reps}회 × ${this.sets}세트 · 예상 1RM ${fmt(this.calc1RM())}kg`;
  }
}

// 유산소 운동 (Exercise 상속)
class CardioExercise extends Exercise {
  constructor(name, minutes, intensity) {
    super(name);
    this.minutes = minutes;
    this.intensity = intensity;
  }
  getType() { return "cardio"; }
  calcVolume() { return 0; }
  calcCalories(bodyWeight) {
    // 강도에 따라 MET 값이 달라짐
    let met;
    switch (this.intensity) {
      case 1: met = 3.5; break;   // 걷기
      case 2: met = 7.0; break;   // 조깅
      default: met = 10.0;        // 달리기
    }
    return met * bodyWeight * (this.minutes / 60);
  }
  getDetail() {
    const level = ["", "가볍게", "보통", "강하게"];
    return `${this.minutes}분 · 강도 ${level[this.intensity]}`;
  }
}

// 운동 기록 관리 클래스 (C++의 WorkoutLog)
class WorkoutLog {
  constructor() { this.list = []; }

  add(ex) { this.list.push(ex); this.save(); }

  remove(index) { this.list.splice(index, 1); this.save(); }

  clear() { this.list = []; this.save(); }

  getStats(bodyWeight) {
    let totalVolume = 0, totalCalories = 0, best = null;
    for (const ex of this.list) {
      totalVolume += ex.calcVolume();              // 오버라이딩된 함수가 호출됨
      totalCalories += ex.calcCalories(bodyWeight);
      // C++의 dynamic_cast 대신 instanceof로 근력 운동만 골라냄
      if (ex instanceof StrengthExercise) {
        if (best === null || ex.calc1RM() > best.calc1RM()) best = ex;
      }
    }
    return { count: this.list.length, totalVolume, totalCalories, best };
  }

  // 브라우저에 저장 (새로고침해도 기록 유지)
  save() {
    try {
      const data = this.list.map(ex => ({ type: ex.getType(), ...ex }));
      localStorage.setItem("workoutLog", JSON.stringify(data));
    } catch (e) { /* 저장 불가한 환경이면 무시 */ }
  }

  load() {
    try {
      const data = JSON.parse(localStorage.getItem("workoutLog") || "[]");
      this.list = data.map(d => d.type === "strength"
        ? new StrengthExercise(d.name, d.weight, d.reps, d.sets)
        : new CardioExercise(d.name, d.minutes, d.intensity));
    } catch (e) { this.list = []; }
  }
}

// ================================================================
//  화면 동작
// ================================================================
const log = new WorkoutLog();
let currentType = "strength";
let currentFilter = "all";

const $ = id => document.getElementById(id);

function getBodyWeight() {
  const bw = parseFloat($("bodyWeight").value);
  return (bw >= 20 && bw <= 300) ? bw : 75;
}

// 근력 / 유산소 탭 선택 → 입력칸이 바뀜
function selectType(type) {
  currentType = type;
  $("tabStrength").classList.toggle("active", type === "strength");
  $("tabCardio").classList.toggle("active", type === "cardio");
  $("strengthInputs").classList.toggle("hidden", type !== "strength");
  $("cardioInputs").classList.toggle("hidden", type !== "cardio");
  $("addBtn").style.background = type === "strength" ? "var(--main)" : "var(--cardio)";
  $("exName").placeholder = type === "strength" ? "예) 벤치 프레스" : "예) 러닝머신";
}

function showMsg(id, text, ok) {
  const el = $(id);
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "error");
}

// 범위 검사 (C++의 readInt / readDouble 역할)
function readNumber(id, min, max) {
  const v = parseFloat($(id).value);
  if (isNaN(v) || v < min || v > max) return null;
  return v;
}

function addExercise() {
  const name = $("exName").value.trim();
  if (name === "") { showMsg("addMsg", "운동 이름을 입력하세요."); return; }

  let ex;
  if (currentType === "strength") {
    const w = readNumber("weight", 0, 1000);
    const r = readNumber("reps", 1, 100);
    const s = readNumber("sets", 1, 50);
    if (w === null || r === null || s === null) {
      showMsg("addMsg", "무게 0~1000, 횟수 1~100, 세트 1~50 사이로 입력하세요.");
      return;
    }
    ex = new StrengthExercise(name, w, Math.round(r), Math.round(s));
  } else {
    const m = readNumber("minutes", 1, 600);
    if (m === null) { showMsg("addMsg", "시간은 1~600분 사이로 입력하세요."); return; }
    ex = new CardioExercise(name, Math.round(m), parseInt($("intensity").value));
  }

  log.add(ex);
  showMsg("addMsg", `'${name}' 기록이 추가되었습니다.`, true);
  ["exName", "weight", "reps", "sets", "minutes"].forEach(id => $(id).value = "");
  $("exName").focus();
  render();
}

function deleteRecord(index) {
  log.remove(index);
  render();
}

function clearAll() {
  if (log.list.length === 0) return;
  log.clear();
  showMsg("addMsg", "모든 기록을 삭제했습니다.", true);
  render();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter button[data-f]").forEach(b =>
    b.classList.toggle("active", b.dataset.f === f));
  render();
}

// 화면 다시 그리기 (기록 목록 + 통계)
function render() {
  const ul = $("recordList");
  ul.innerHTML = "";

  const items = log.list
    .map((ex, i) => ({ ex, i }))
    .filter(o => currentFilter === "all" || o.ex.getType() === currentFilter);

  if (items.length === 0) {
    ul.innerHTML = '<li class="empty">아직 기록이 없습니다. 왼쪽에서 운동을 추가해 보세요.</li>';
  }

  for (const { ex, i } of items) {
    const isStr = ex.getType() === "strength";
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="badge ${ex.getType()}">${isStr ? "근력" : "유산소"}</span>
      <div class="rec-body">
        <div class="rec-name"></div>
        <div class="rec-detail">${ex.getDetail()}</div>
      </div>
      <button class="btn-del" onclick="deleteRecord(${i})">삭제</button>`;
    li.querySelector(".rec-name").textContent = ex.name;   // 이름은 텍스트로만 넣기
    ul.appendChild(li);
  }

  const st = log.getStats(getBodyWeight());
  $("statCount").innerHTML = `${st.count}<span class="unit">개</span>`;
  $("statVolume").innerHTML = `${Math.round(st.totalVolume).toLocaleString()}<span class="unit">kg</span>`;
  $("statKcal").innerHTML = `${Math.round(st.totalCalories)}<span class="unit">kcal</span>`;
  if (st.best) {
    $("statBest").innerHTML = `${fmt(st.best.calc1RM())}<span class="unit">kg</span>`;
    $("statBest").title = st.best.name;
    $("statBest").insertAdjacentHTML("beforeend", `<div class="unit" style="font-size:12px"></div>`);
    $("statBest").lastChild.textContent = st.best.name;
  } else {
    $("statBest").textContent = "-";
  }
}

// 1RM 계산 + 목표별 추천 중량
function calcOneRM() {
  const w = readNumber("rmWeight", 1, 1000);
  const r = readNumber("rmReps", 1, 30);
  if (w === null || r === null) {
    $("rmMsg").textContent = "무게 1~1000kg, 횟수 1~30회 사이로 입력하세요.";
    $("rmResult").classList.remove("show");
    return;
  }
  $("rmMsg").textContent = "";

  const oneRM = calc1RM(w, Math.round(r));
  let goalName, percents;
  switch ($("goal").value) {
    case "1": goalName = "근력";     percents = [90, 85, 80]; break;
    case "2": goalName = "근비대";   percents = [75, 70, 65]; break;
    default:  goalName = "근지구력"; percents = [60, 55, 50];
  }

  $("rmValue").textContent = fmt(oneRM) + "kg";
  $("rmGoalName").textContent = `[${goalName}] 추천 훈련 중량`;
  $("rmBars").innerHTML = percents.map(p => `
    <div class="bar-row">
      <span>${p}%</span>
      <div class="bar"><div style="width:${p}%"></div></div>
      <span class="kg">${fmt(oneRM * p / 100)}kg</span>
    </div>`).join("");
  $("rmResult").classList.add("show");
}

// 엔터키로도 추가 / 계산되게
["exName", "weight", "reps", "sets", "minutes"].forEach(id =>
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") addExercise(); }));
["rmWeight", "rmReps"].forEach(id =>
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") calcOneRM(); }));
$("bodyWeight").addEventListener("input", render);

// 시작할 때 저장된 기록 불러오기
log.load();
render();
</script>
</body>
</html>
